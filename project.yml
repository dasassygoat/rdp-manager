name: RDPManager
options:
  bundleIdPrefix: com.lanservices
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: false
    ARCHS: "arm64 x86_64"
    ONLY_ACTIVE_ARCH: NO
targets:
  RDPManager:
    type: application
    platform: macOS
    sources:
      - path: RDPManager
        excludes:
          - "Info.plist"
          - "CLI"
    info:
      path: RDPManager/Info.plist
      properties:
        CFBundleDisplayName: RDP Manager
        CFBundleName: RDP Manager
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: ""
        NSLocalNetworkUsageDescription: RDP Manager checks whether the computers you added are online and sends Wake-on-LAN packets.
        NSUserNotificationsUsageDescription: RDP Manager notifies you when a computer goes offline or changes its IP address.
    entitlements:
      path: RDPManager/RDPManager.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lanservices.rdpmanager
        PRODUCT_NAME: RDP Manager
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  rdpm:
    type: tool
    platform: macOS
    # Shares the model and the store location with the app so both read one machines.json.
    sources:
      - path: RDPManager/CLI
      - path: RDPManager/Models
    settings:
      base:
        PRODUCT_NAME: rdpm
        PRODUCT_BUNDLE_IDENTIFIER: com.lanservices.rdpmanager.cli
        SWIFT_VERSION: "5.0"
        CODE_SIGN_IDENTITY: "-"
  RDPManagerTests:
    type: bundle.unit-test
    platform: macOS
    # The files under test are compiled straight into the bundle rather than loaded from
    # the app: the tests then run without launching RDP Manager, which would start its
    # pollers and ask for notification permission.
    sources:
      - path: Tests
      - path: RDPManager/Models
      - path: RDPManager/Store
      - path: RDPManager/Services
      - path: RDPManager/CLI/MachineLookup.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lanservices.rdpmanager.tests
        GENERATE_INFOPLIST_FILE: true
schemes:
  RDPManager:
    build:
      targets:
        RDPManager: all
        rdpm: all
    test:
      targets:
        - RDPManagerTests
