name: RDPManager
options:
  bundleIdPrefix: com.lanservices
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: false
targets:
  RDPManager:
    type: application
    platform: macOS
    sources:
      - path: RDPManager
        excludes:
          - "Info.plist"
    info:
      path: RDPManager/Info.plist
      properties:
        CFBundleDisplayName: RDP Manager
        CFBundleName: RDP Manager
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: ""
        NSLocalNetworkUsageDescription: RDP Manager checks whether the computers you added are online and sends Wake-on-LAN packets.
        NSUserNotificationsUsageDescription: RDP Manager notifies you when a computer goes offline or changes its IP address.
    entitlements:
      path: RDPManager/RDPManager.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lanservices.rdpmanager
        PRODUCT_NAME: RDP Manager
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
