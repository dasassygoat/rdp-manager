name: RDPManager
options:
  bundleIdPrefix: com.lanservices
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 7
    CODE_SIGN_STYLE: Manual
    ARCHS: "arm64 x86_64"
    ONLY_ACTIVE_ARCH: NO
  configs:
    # Debug stays ad-hoc signed so a build needs no certificate: that is what CI runs.
    Debug:
      CODE_SIGN_IDENTITY: "-"
      DEVELOPMENT_TEAM: ""
      ENABLE_HARDENED_RUNTIME: false
    # Release is what gets distributed, so it is signed with the Developer ID and gets the
    # hardened runtime and a secure timestamp, both of which notarization requires.
    Release:
      CODE_SIGN_IDENTITY: "Developer ID Application"
      DEVELOPMENT_TEAM: LT92GD6MBZ
      ENABLE_HARDENED_RUNTIME: true
      OTHER_CODE_SIGN_FLAGS: "--timestamp"
targets:
  RDPManager:
    type: application
    platform: macOS
    sources:
      - path: RDPManager
        excludes:
          - "Info.plist"
          - "CLI"
    info:
      path: RDPManager/Info.plist
      properties:
        CFBundleDisplayName: RDP Manager
        CFBundleName: RDP Manager
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: ""
        NSLocalNetworkUsageDescription: RDP Manager checks whether the computers you added are online, scans this network when you ask it to find machines, and sends Wake-on-LAN packets.
        NSUserNotificationsUsageDescription: RDP Manager notifies you when a computer goes offline or changes its IP address.
    entitlements:
      path: RDPManager/RDPManager.entitlements
      properties:
        com.apple.security.app-sandbox: false
    # rdpm rides inside the bundle, so copying the app to another Mac brings the command
    # with it and install-cli.sh only has to make a symlink.
    dependencies:
      - target: rdpm
        embed: false
    postBuildScripts:
      - name: Embed rdpm in Helpers
        basedOnDependencyAnalysis: true
        inputFiles:
          - "$(TARGET_BUILD_DIR)/rdpm"
        outputFiles:
          - "$(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/rdpm"
        script: |
          set -euo pipefail
          HELPERS="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers"
          mkdir -p "$HELPERS"
          cp -f "$TARGET_BUILD_DIR/rdpm" "$HELPERS/rdpm"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lanservices.rdpmanager
        PRODUCT_NAME: RDP Manager
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  rdpm:
    type: tool
    platform: macOS
    # Shares the model and the store location with the app so both read one machines.json.
    sources:
      - path: RDPManager/CLI
      - path: RDPManager/Models
    settings:
      base:
        PRODUCT_NAME: rdpm
        PRODUCT_BUNDLE_IDENTIFIER: com.lanservices.rdpmanager.cli
        SWIFT_VERSION: "5.0"
        # A command-line tool has no Info.plist of its own, so one is synthesised and
        # embedded in the binary; that is where `rdpm version` reads the number from.
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
  RDPManagerTests:
    type: bundle.unit-test
    platform: macOS
    # The files under test are compiled straight into the bundle rather than loaded from
    # the app: the tests then run without launching RDP Manager, which would start its
    # pollers and ask for notification permission.
    sources:
      - path: Tests
      - path: RDPManager/Models
      - path: RDPManager/Store
      - path: RDPManager/Services
      - path: RDPManager/CLI/MachineLookup.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lanservices.rdpmanager.tests
        GENERATE_INFOPLIST_FILE: true
schemes:
  RDPManager:
    build:
      targets:
        RDPManager: all
        rdpm: all
    test:
      targets:
        - RDPManagerTests
